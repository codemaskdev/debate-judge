name: ep05-check-light-first
nodes:
  d:
    pattern: debate
    agent: llm://openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    system_prompt: "Topic of the debate: should a code editor use a dark theme or a light theme?"
    inputs:
      topic: "should a code editor use a dark theme or a light theme?"
    config:
      agents: 2
      steps:
        agent_1:
          prompt: "Argue strongly that a code editor should use a light theme. Keep it under 120 words."
        agent_2:
          prompt: "Argue strongly that a code editor should use a dark theme. Keep it under 120 words."
        judge:
          prompt: "Evaluate the arguments and render a verdict in two or three sentences: name the decisive argument. Then end with a last line in exactly this form: WINNER: dark  or  WINNER: light"
    outputs: [verdict]
